<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowbit.in</title>
<link rel="icon" href="photo/logo.png" type="image/png">
<link rel="stylesheet" href="user.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="#/" class="brand" aria-label="Knowbit home">
      <img src="photo/logo.png" alt="" class="brand-mark">
      <span class="brand-word">Knowbit<span class="brand-dot">.in</span></span>
    </a>

    <form class="searchbox" id="searchForm" role="search">
      <svg viewBox="0 0 20 20" class="searchbox-icon" aria-hidden="true"><path d="M13.5 12.5 18 17M15 8.5A6.5 6.5 0 1 1 2 8.5a6.5 6.5 0 0 1 13 0Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Search posts, people, topics" aria-label="Search Knowbit">
    </form>

    <nav class="topbar-actions">
      <button class="btn btn-primary write-btn" id="writeBtn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/></svg>
        Write
      </button>
      <div class="notif-wrap menu-wrap" id="notifWrap">
        <button class="iconbtn" id="notifBtn" aria-label="Notifications" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
          <span class="notif-badge hidden" id="notifBadge">0</span>
        </button>
        <div class="dropdown dropdown-wide hidden" id="notifDropdown"></div>
      </div>
      <div class="menu-wrap" id="profileMenuWrap">
        <button class="menu-trigger" id="profileMenuBtn" type="button">
          <span id="headerAvatar"></span>
          <svg class="menu-caret" viewBox="0 0 20 20"><path d="m5 7 5 6 5-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="dropdown hidden" id="profileDropdown"></div>
      </div>
    </nav>
  </div>
</header>

<div class="shell">
  <aside class="rail" aria-label="Primary">
    <button class="btn btn-primary btn-block write-btn" id="railWriteBtn" type="button" style="margin-bottom:18px;justify-content:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/></svg>
      Write New Post
    </button>
    <nav class="rail-nav">
      <a href="#/" class="rail-link" data-route="home">
        <svg viewBox="0 0 24 24" class="rail-icon"><path d="M4 11.5 12 4l8 7.5M6 10v9h5v-5.5h2V19h5v-9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Home</span>
      </a>
      <a href="#/explore" class="rail-link" data-route="explore">
        <svg viewBox="0 0 24 24" class="rail-icon"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m14.6 9.4-2 5.2-5.2 2 2-5.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>Explore</span>
      </a>
      <a href="#/bookmarks" class="rail-link" data-route="bookmarks">
        <svg viewBox="0 0 24 24" class="rail-icon"><path d="M6 3h12v18l-6-4-6 4V3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>Bookmarks</span>
      </a>
      <a href="#/likes" class="rail-link" data-route="likes">
        <svg viewBox="0 0 24 24" class="rail-icon"><path d="M12 20s-7.5-4.6-9.8-9A5.3 5.3 0 0 1 12 6a5.3 5.3 0 0 1 9.8 5c-2.3 4.4-9.8 9-9.8 9Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>Liked posts</span>
      </a>
      <a href="#/notifications" class="rail-link" data-route="notifications">
        <svg viewBox="0 0 24 24" class="rail-icon"><path d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 19a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>Notifications</span>
      </a>
      <a href="#/my-posts" class="rail-link" data-route="my-posts">
        <svg viewBox="0 0 24 24" class="rail-icon"><rect x="4" y="4" width="16" height="16" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>My Posts</span>
      </a>
      <a href="#/drafts" class="rail-link" data-route="drafts">
        <svg viewBox="0 0 24 24" class="rail-icon"><path d="M6 3h9l5 5v13H6V3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 3v5h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>Drafts</span>
      </a>
      <a href="#/analytics" class="rail-link" data-route="analytics">
        <svg viewBox="0 0 24 24" class="rail-icon"><path d="M5 19V9m6.5 10V4M18 19v-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>Analytics</span>
      </a>
      <a href="#/settings" class="rail-link" data-route="settings">
        <svg viewBox="0 0 24 24" class="rail-icon"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.9-1.4-2-3.4-2.2.8a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.5 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.2-.8-2 3.4L4.6 10.5a7.6 7.6 0 0 0 0 3L2.7 15l2 3.4 2.2-.8c.75.66 1.63 1.17 2.6 1.5l.5 2.4h4l.5-2.4a7.6 7.6 0 0 0 2.6-1.5l2.2.8 2-3.4-1.9-1.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="rail-topics">
      <p class="rail-heading">Topics</p>
      <div id="railTopics" class="rail-topic-list"></div>
    </div>

    <a href="#/profile" id="railProfileLink" class="rail-profile">
      <span id="railAvatar"></span>
      <div class="rail-profile-body">
        <div class="rail-profile-name" id="railName">—</div>
        <div class="rail-profile-handle" id="railHandle">—</div>
      </div>
    </a>
  </aside>

  <main class="content" id="content" tabindex="-1"></main>

  <aside class="side" id="side" aria-label="Discovery"></aside>
</div>

<nav class="bottomnav" aria-label="Primary">
  <a href="#/" class="bottomnav-link" data-route="home">
    <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5M6 10v9h5v-5.5h2V19h5v-9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Home</span>
  </a>
  <a href="#/explore" class="bottomnav-link" data-route="explore">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m14.6 9.4-2 5.2-5.2 2 2-5.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span>Explore</span>
  </a>
  <button class="bottomnav-link" id="bottomWriteBtn" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>Write</span>
  </button>
  <a href="#/notifications" class="bottomnav-link" data-route="notifications">
    <svg viewBox="0 0 24 24"><path d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 19a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
    <span>Alerts</span>
  </a>
  <a href="#/profile" class="bottomnav-link" data-route="profile">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>Profile</span>
  </a>
</nav>

<div class="modal-layer hidden" id="modalLayer" aria-hidden="true">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div id="authGate" class="empty" style="display:none;margin:80px auto;max-width:420px;">
  <p class="empty-title">Please log in</p>
  <p class="empty-body">Redirecting you to the login page…</p>
</div>

<script type="module" src="user.js"></script>
</body>
</html>
